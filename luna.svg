<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Main Sphere Body -->
    <circle cx="50" cy="50" r="45" fill="#ffd700" stroke="#b8860b" stroke-width="3"/>
    
    <!-- Cockpit / Glass -->
    <circle cx="50" cy="50" r="25" fill="rgba(135, 206, 235, 0.9)" stroke="#fff" stroke-width="2"/>
    
    <!-- Tech details / Lines -->
    <path d="M50,5 L50,25" stroke="#b8860b" stroke-width="3"/>
    <path d="M50,75 L50,95" stroke="#b8860b" stroke-width="3"/>
    <path d="M5,50 L25,50" stroke="#b8860b" stroke-width="3"/>
    <path d="M75,50 L95,50" stroke="#b8860b" stroke-width="3"/>
    
    <!-- Glow effects -->
    <circle cx="50" cy="50" r="10" fill="#fff" opacity="0.3"/>
</svg>
